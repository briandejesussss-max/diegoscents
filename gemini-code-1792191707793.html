<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Oficial & Decants</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- html2canvas para exportar a Instagram -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <!-- Tipografía Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 0%, #151824 0%, #08090C 100%);
      color: #FFFFFF;
      min-height: 100vh;
      margin: 0;
    }

    .font-brand {
      font-family: 'Montserrat', sans-serif;
    }

    /* Reglas para imprimir en PDF A4 */
    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      html, body {
        background: #08090C !important;
        color: #FFFFFF !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .no-print,
      #top-navbar,
      #toast-container,
      #fragrance-modal,
      #store-modal,
      button {
        display: none !important;
      }

      #catalog-sheet {
        display: block !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .pdf-sheet-page {
        page-break-after: always !important;
        break-after: page !important;
        height: 297mm !important;
        max-height: 297mm !important;
        min-height: 297mm !important;
        padding: 10mm 12mm !important;
        margin: 0 !important;
        background: #08090C !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: space-between !important;
      }

      .pdf-sheet-page:last-child {
        page-break-after: auto !important;
        break-after: auto !important;
      }

      .catalog-grid-2x2 {
        display: grid !important;
        grid-template-columns: repeat(2, 1fr) !important;
        grid-template-rows: repeat(2, 1fr) !important;
        gap: 12px !important;
        flex: 1 !important;
      }

      .catalog-card-item {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
        background: #0F121A !important;
        border: 1px solid #2A3042 !important;
      }
    }

    .pdf-sheet-page {
      background: linear-gradient(180deg, #0E1017 0%, #08090D 100%);
      border: 1px solid #1E2333;
      border-radius: 1.25rem;
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
      position: relative;
    }

    .glass-card {
      background: rgba(18, 21, 31, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(212, 175, 55, 0.15);
      transition: all 0.25s ease;
    }

    .glass-card:hover {
      border-color: rgba(212, 175, 55, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body class="flex flex-col antialiased">

  <!-- BARRA DE CONTROL SUPERIOR -->
  <header id="top-navbar" class="no-print sticky top-0 z-40 bg-[#0A0C12]/90 backdrop-blur-md border-b border-zinc-800/80 px-4 py-3">
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
      
      <!-- LOGO Y DATOS DE LA MARCA -->
      <div class="flex items-center space-x-3">
        <div class="relative group cursor-pointer" onclick="document.getElementById('quick-logo-input').click()" title="Haz clic para subir tu logotipo">
          <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-[#D4AF37] via-[#FFF1B0] to-[#997715] p-[1.5px] shadow-lg shadow-[#D4AF37]/10 flex items-center justify-center">
            <div class="w-full h-full bg-[#0D0F17] rounded-[10px] flex items-center justify-center overflow-hidden">
              <img id="header-logo-img" src="" alt="Logo" class="hidden w-full h-full object-contain p-1">
              <span id="header-logo-icon" class="text-[#D4AF37] font-brand font-black text-sm tracking-wider">DS</span>
            </div>
          </div>
          <div class="absolute inset-0 bg-black/60 rounded-xl flex items-center justify-center opacity-0 group-hover:opacity-100 transition duration-200">
            <i data-lucide="camera" class="w-4 h-4 text-white"></i>
          </div>
          <input type="file" id="quick-logo-input" accept="image/*" class="hidden" onchange="handleDirectLogoUpload(event)">
        </div>

        <div>
          <h1 id="header-store-name" class="font-brand text-sm font-extrabold tracking-wider text-white uppercase">DIEGO SCENTS</h1>
          <p class="text-[11px] text-zinc-400">Alta Perfumería • Decants Exclusivos</p>
        </div>
      </div>

      <!-- BOTONES DE GESTIÓN -->
      <div class="flex items-center flex-wrap gap-2">
        <button onclick="document.getElementById('quick-logo-input').click()" class="px-3 py-1.5 rounded-xl bg-gradient-to-r from-[#D4AF37]/20 to-amber-500/10 hover:from-[#D4AF37]/30 text-xs text-[#F1D779] border border-[#D4AF37]/40 flex items-center gap-1.5 transition font-semibold">
          <i data-lucide="image-plus" class="w-3.5 h-3.5"></i>
          <span>Subir Logo</span>
        </button>

        <button onclick="openStoreConfigModal()" class="px-3 py-1.5 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-xs text-zinc-200 border border-zinc-700/80 flex items-center gap-1.5 transition">
          <i data-lucide="settings" class="w-3.5 h-3.5 text-[#D4AF37]"></i>
          <span>Configurar Tienda</span>
        </button>

        <button onclick="exportBackupData()" class="px-3 py-1.5 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-xs text-amber-300 border border-zinc-700/80 flex items-center gap-1.5 transition">
          <i data-lucide="download" class="w-3.5 h-3.5"></i>
          <span>Respaldar JSON</span>
        </button>

        <label class="cursor-pointer px-3 py-1.5 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-xs text-zinc-200 border border-zinc-700/80 flex items-center gap-1.5 transition">
          <i data-lucide="upload" class="w-3.5 h-3.5 text-[#D4AF37]"></i>
          <span>Cargar Copia</span>
          <input type="file" accept=".json" class="hidden" onchange="importBackupData(event)">
        </label>

        <button onclick="openFragranceModal()" class="px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-[#D4AF37] to-[#F3DE8A] text-black font-extrabold text-xs flex items-center gap-1.5 shadow-md shadow-[#D4AF37]/20 hover:brightness-110 active:scale-95 transition">
          <i data-lucide="plus" class="w-3.5 h-3.5 stroke-[3]"></i>
          <span>+ Fragancia</span>
        </button>

        <button onclick="window.print()" class="px-3.5 py-1.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-white text-xs font-semibold flex items-center gap-1.5 border border-zinc-600 transition">
          <i data-lucide="printer" class="w-3.5 h-3.5 text-[#D4AF37]"></i>
          <span>Exportar PDF</span>
        </button>
      </div>

    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-4 flex flex-col gap-4">

    <!-- BUSCADOR Y FILTROS -->
    <section class="no-print bg-[#0F1118]/80 backdrop-blur border border-zinc-800/80 rounded-2xl p-3 flex flex-wrap items-center justify-between gap-3 shadow-md">
      <div class="flex items-center gap-2 flex-1 min-w-[240px]">
        <div class="relative w-full">
          <i data-lucide="search" class="w-4 h-4 text-zinc-400 absolute left-3 top-2.5"></i>
          <input 
            type="text" 
            id="search-input" 
            oninput="filterCatalog()"
            placeholder="Buscar fragancia, casa olfativa o notas..." 
            class="w-full bg-[#161822] border border-zinc-700/80 rounded-xl pl-9 pr-3 py-1.5 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-[#D4AF37]"
          >
        </div>
        <select 
          id="filter-brand" 
          onchange="filterCatalog()" 
          class="bg-[#161822] border border-zinc-700/80 rounded-xl px-2.5 py-1.5 text-xs text-zinc-200 focus:outline-none max-w-[170px]">
          <option value="ALL">Todas las Casas</option>
        </select>
      </div>

      <div class="flex items-center gap-2">
        <select id="currency-symbol" onchange="renderCatalog()" class="bg-[#161822] border border-zinc-700/80 text-xs text-white rounded-xl px-2.5 py-1.5 focus:outline-none">
          <option value="$">$ (MXN)</option>
          <option value="USD $">USD $</option>
        </select>
      </div>
    </section>

    <!-- ÁREA DE HOJAS DEL CATÁLOGO -->
    <div class="w-full flex justify-center">
      <div id="catalog-sheet" class="w-full max-w-[860px]"></div>
    </div>

    <div id="empty-state" class="hidden py-16 text-center">
      <i data-lucide="package-search" class="w-10 h-10 text-zinc-600 mx-auto mb-2"></i>
      <h3 class="text-sm font-semibold text-zinc-300">No se encontraron fragancias</h3>
      <p class="text-xs text-zinc-500 mt-1">Intenta con otro término o añade una nueva botella.</p>
    </div>
  </main>

  <!-- MODAL PARA AGREGAR/EDITAR FRAGANCIA -->
  <div id="fragrance-modal" class="no-print fixed inset-0 z-50 bg-black/85 backdrop-blur-sm hidden flex items-center justify-center p-3 overflow-y-auto">
    <div class="bg-[#12141C] border border-zinc-700 rounded-2xl w-full max-w-lg p-5 relative text-xs">
      <button onclick="closeFragranceModal()" class="absolute top-4 right-4 text-zinc-400 hover:text-white">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <div class="mb-4">
        <span class="text-[10px] tracking-widest text-[#D4AF37] uppercase font-bold">Gestión de Catálogo</span>
        <h3 id="modal-title" class="font-brand text-base font-bold text-white mt-0.5">Editar Fragancia</h3>
      </div>

      <form id="fragrance-form" onsubmit="handleFragranceSubmit(event)" class="space-y-3">
        <input type="hidden" id="form-edit-id" value="">

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-zinc-300 mb-1">Nombre</label>
            <input type="text" id="frag-name" required class="w-full bg-[#181B26] border border-zinc-700 rounded-xl px-3 py-1.5 text-white focus:outline-none focus:border-[#D4AF37]">
          </div>
          <div>
            <label class="block font-medium text-zinc-300 mb-1">Marca / Casa</label>
            <input type="text" id="frag-brand" required class="w-full bg-[#181B26] border border-zinc-700 rounded-xl px-3 py-1.5 text-white focus:outline-none focus:border-[#D4AF37]">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-zinc-300 mb-1">Concentración</label>
            <input type="text" id="frag-concentration" placeholder="Eau de Parfum, Elixir..." class="w-full bg-[#181B26] border border-zinc-700 rounded-xl px-3 py-1.5 text-white focus:outline-none">
          </div>
          <div>
            <label class="block font-medium text-zinc-300 mb-1">Categoría</label>
            <select id="frag-gender" class="w-full bg-[#181B26] border border-zinc-700 rounded-xl px-3 py-1.5 text-white focus:outline-none">
              <option value="Unisex">Unisex</option>
              <option value="Masculino">Masculino</option>
              <option value="Femenino">Femenino</option>
            </select>
          </div>
        </div>

        <!-- FOTOGRAFÍA -->
        <div class="p-3 rounded-xl bg-[#090A0E] border border-zinc-800 space-y-2">
          <label class="block font-semibold text-zinc-300">Fotografía de la Botella</label>
          <div class="flex items-center gap-3">
            <div class="flex-1 space-y-1.5">
              <input type="text" id="frag-image-url" placeholder="URL directa o base64" oninput="updateImagePreview(this.value)" class="w-full bg-[#181B26] border border-zinc-700 rounded-lg px-2.5 py-1 text-white text-[11px] focus:outline-none">
              <label class="cursor-pointer inline-flex items-center gap-1.5 px-2.5 py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-600 text-[10px]">
                <i data-lucide="image" class="w-3 h-3 text-[#D4AF37]"></i>
                <span>Subir archivo de imagen</span>
                <input type="file" accept="image/*" class="hidden" onchange="handleLocalImageUpload(event)">
              </label>
            </div>
            <div class="w-14 h-16 rounded bg-zinc-900 border border-zinc-700 flex items-center justify-center overflow-hidden shrink-0">
              <img id="frag-preview-img" src="" class="w-full h-full object-contain hidden" alt="">
              <span id="frag-preview-placeholder" class="text-zinc-600 text-[9px]">Sin Foto</span>
            </div>
          </div>
        </div>

        <!-- PRECIOS -->
        <div class="p-2.5 rounded-xl bg-[#151722] border border-[#D4AF37]/30 space-y-1.5">
          <span class="text-[10px] font-bold text-[#D4AF37] uppercase tracking-wider block">Precios de Decants</span>
          <div class="grid grid-cols-3 gap-2">
            <div class="bg-[#0C0E14] p-2 rounded-lg border border-zinc-800">
              <div class="flex justify-between text-[10px] text-zinc-400 mb-1">
                <span>3 ml</span>
                <label><input type="checkbox" id="frag-3ml-avail" checked> Stock</label>
              </div>
              <input type="number" id="frag-price-3ml" class="w-full bg-[#181B26] border border-zinc-700 rounded px-2 py-0.5 text-white text-xs">
            </div>

            <div class="bg-[#0C0E14] p-2 rounded-lg border border-[#D4AF37]/40">
              <div class="flex justify-between text-[10px] text-[#D4AF37] mb-1">
                <span class="font-bold">5 ml</span>
                <label><input type="checkbox" id="frag-5ml-avail" checked> Stock</label>
              </div>
              <input type="number" id="frag-price-5ml" class="w-full bg-[#181B26] border border-zinc-700 rounded px-2 py-0.5 text-[#D4AF37] font-bold text-xs">
            </div>

            <div class="bg-[#0C0E14] p-2 rounded-lg border border-zinc-800">
              <div class="flex justify-between text-[10px] text-zinc-400 mb-1">
                <span>10 ml</span>
                <label><input type="checkbox" id="frag-10ml-avail" checked> Stock</label>
              </div>
              <input type="number" id="frag-price-10ml" class="w-full bg-[#181B26] border border-zinc-700 rounded px-2 py-0.5 text-white text-xs">
            </div>
          </div>
        </div>

        <div>
          <label class="block font-medium text-zinc-300 mb-1">Notas Olfativas</label>
          <textarea id="frag-notes" rows="2" class="w-full bg-[#181B26] border border-zinc-700 rounded-xl px-3 py-1.5 text-white focus:outline-none"></textarea>
        </div>

        <div class="pt-2 flex justify-end gap-2 border-t border-zinc-800">
          <button type="button" onclick="closeFragranceModal()" class="px-3 py-1.5 rounded-lg bg-zinc-800 text-zinc-300">Cancelar</button>
          <button type="submit" class="px-4 py-1.5 rounded-lg bg-[#D4AF37] text-black font-bold">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL CONFIGURACIÓN TIENDA / LOGOTIPO -->
  <div id="store-modal" class="no-print fixed inset-0 z-50 bg-black/85 backdrop-blur-sm hidden flex items-center justify-center p-3 text-xs">
    <div class="bg-[#12141C] border border-zinc-700 rounded-2xl w-full max-w-md p-5 relative">
      <button onclick="closeStoreConfigModal()" class="absolute top-4 right-4 text-zinc-400 hover:text-white">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <h3 class="font-brand text-base font-bold text-white mb-3">Datos de Marca & Logotipo</h3>

      <form onsubmit="handleStoreConfigSubmit(event)" class="space-y-3">
        <!-- APARTADO DE LOGOTIPO -->
        <div class="p-3 rounded-xl bg-[#090A0E] border border-zinc-800 flex items-center gap-3">
          <div class="w-14 h-14 rounded-xl bg-zinc-900 border border-zinc-700 flex items-center justify-center overflow-hidden shrink-0">
            <img id="modal-logo-preview" src="" class="hidden w-full h-full object-contain p-1" alt="Logo">
            <span id="modal-logo-placeholder" class="text-zinc-500 text-[10px]">Sin Logo</span>
          </div>
          <div class="flex-1 space-y-1">
            <label class="block font-semibold text-zinc-200">Logotipo Oficial</label>
            <div class="flex items-center gap-2">
              <label class="cursor-pointer px-2.5 py-1 rounded bg-[#D4AF37]/20 hover:bg-[#D4AF37]/30 text-[#F1D779] border border-[#D4AF37]/40 text-[11px] font-semibold flex items-center gap-1">
                <i data-lucide="upload" class="w-3 h-3"></i>
                <span>Elegir imagen</span>
                <input type="file" accept="image/*" class="hidden" onchange="handleModalLogoUpload(event)">
              </label>
              <button type="button" onclick="removeLogo()" class="px-2 py-1 rounded bg-zinc-800 text-zinc-400 hover:text-red-400 text-[11px]">Quitar</button>
            </div>
            <input type="text" id="config-store-logo" placeholder="O pega el enlace de tu logo" oninput="updateLogoModalPreview(this.value)" class="w-full bg-[#181B26] border border-zinc-700 rounded px-2 py-1 text-white text-[10px] mt-1">
          </div>
        </div>

        <div>
          <label class="block text-zinc-300 mb-1">Nombre Comercial</label>
          <input type="text" id="config-store-name" required class="w-full bg-[#181B26] border border-zinc-700 rounded-xl px-3 py-1.5 text-white">
        </div>
        <div>
          <label class="block text-zinc-300 mb-1">Lema o Subtítulo</label>
          <input type="text" id="config-store-tagline" class="w-full bg-[#181B26] border border-zinc-700 rounded-xl px-3 py-1.5 text-white">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-zinc-300 mb-1">WhatsApp</label>
            <input type="text" id="config-store-whatsapp" class="w-full bg-[#181B26] border border-zinc-700 rounded-xl px-3 py-1.5 text-white">
          </div>
          <div>
            <label class="block text-zinc-300 mb-1">Instagram</label>
            <input type="text" id="config-store-instagram" class="w-full bg-[#181B26] border border-zinc-700 rounded-xl px-3 py-1.5 text-white">
          </div>
        </div>
        <div>
          <label class="block text-zinc-300 mb-1">Información de Envíos / Garantía</label>
          <input type="text" id="config-store-notes" class="w-full bg-[#181B26] border border-zinc-700 rounded-xl px-3 py-1.5 text-white">
        </div>

        <div class="pt-3 flex justify-end gap-2 border-t border-zinc-800">
          <button type="button" onclick="closeStoreConfigModal()" class="px-3 py-1.5 rounded-lg bg-zinc-800 text-zinc-300">Cancelar</button>
          <button type="submit" class="px-4 py-1.5 rounded-lg bg-[#D4AF37] text-black font-bold">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container" class="no-print fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script>
    let storeConfig = {
      name: "DIEGO SCENTS",
      tagline: "TU MUESTRA DE LUJO AL MEJOR PRECIO",
      whatsapp: "+52 243 106 6247",
      instagram: "@scents.by.diego",
      notes: "Envíos express a toda la república y entregas personales en Izúcar de Matamoros, Puebla",
      logo: ""
    };

    let fragrances = [];
    const ITEMS_PER_PAGE = 4;

    function initApp() {
      try {
        const storedStore = localStorage.getItem('aura_store_config');
        if (storedStore) storeConfig = { ...storeConfig, ...JSON.parse(storedStore) };
      } catch(e) {}

      try {
        const storedFrag = localStorage.getItem('aura_fragrances');
        if (storedFrag) fragrances = JSON.parse(storedFrag);
      } catch(e) {}

      updateStoreBrandHeader();
      populateBrandFilter();
      renderCatalog();
      lucide.createIcons();
    }

    function updateStoreBrandHeader() {
      document.getElementById('header-store-name').textContent = storeConfig.name;
      const logoImg = document.getElementById('header-logo-img');
      const logoIcon = document.getElementById('header-logo-icon');

      if (storeConfig.logo && storeConfig.logo.trim() !== '') {
        logoImg.src = storeConfig.logo;
        logoImg.classList.remove('hidden');
        logoIcon.classList.add('hidden');
      } else {
        logoImg.classList.add('hidden');
        logoIcon.classList.remove('hidden');
        const initials = storeConfig.name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase() || 'DS';
        logoIcon.textContent = initials;
      }
    }

    function handleDirectLogoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        storeConfig.logo = e.target.result;
        saveStoreConfig();
        showToast('¡Logotipo actualizado con éxito!');
      };
      reader.readAsDataURL(file);
    }

    function handleModalLogoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('config-store-logo').value = e.target.result;
        updateLogoModalPreview(e.target.result);
      };
      reader.readAsDataURL(file);
    }

    function updateLogoModalPreview(url) {
      const preview = document.getElementById('modal-logo-preview');
      const placeholder = document.getElementById('modal-logo-placeholder');
      if (url && url.trim() !== '') {
        preview.src = url;
        preview.classList.remove('hidden');
        placeholder.classList.add('hidden');
      } else {
        preview.src = '';
        preview.classList.add('hidden');
        placeholder.classList.remove('hidden');
      }
    }

    function removeLogo() {
      document.getElementById('config-store-logo').value = '';
      updateLogoModalPreview('');
    }

    function saveFragrances() {
      try {
        localStorage.setItem('aura_fragrances', JSON.stringify(fragrances));
      } catch (err) {}
      populateBrandFilter();
    }

    function saveStoreConfig() {
      try {
        localStorage.setItem('aura_store_config', JSON.stringify(storeConfig));
      } catch(e) {}
      updateStoreBrandHeader();
      renderCatalog();
    }

    function exportBackupData() {
      const dataToExport = {
        store: storeConfig,
        fragrances: fragrances,
        exportDate: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(dataToExport, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `Respaldo_${storeConfig.name.replace(/\s+/g, '_')}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Copia de seguridad guardada');
    }

    function importBackupData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed.fragrances && Array.isArray(parsed.fragrances)) {
            fragrances = parsed.fragrances;
            if (parsed.store) storeConfig = { ...storeConfig, ...parsed.store };
            saveFragrances();
            saveStoreConfig();
            renderCatalog();
            showToast('Datos cargados con éxito');
          }
        } catch(err) {
          showToast('Error al importar el archivo JSON');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function populateBrandFilter() {
      const select = document.getElementById('filter-brand');
      const currentVal = select.value;
      const brands = Array.from(new Set(fragrances.map(f => f.brand))).filter(Boolean).sort();

      select.innerHTML = '<option value="ALL">Todas las Marcas</option>';
      brands.forEach(brand => {
        const opt = document.createElement('option');
        opt.value = brand;
        opt.textContent = brand;
        select.appendChild(opt);
      });

      if (brands.includes(currentVal)) {
        select.value = currentVal;
      }
    }

    function getCurrencySymbol() {
      return document.getElementById('currency-symbol')?.value || '$';
    }

    function formatPrice(val) {
      const num = parseFloat(val);
      if (isNaN(num) || num <= 0) return 'Agotado';
      return `${getCurrencySymbol()}${num.toFixed(0)}`;
    }

    function renderCatalog() {

      const emptyState = document.getElementById('empty-state');
      const searchQuery = (document.getElementById('search-input').value || '').toLowerCase().trim();
      const selectedBrand = document.getElementById('filter-brand').value;

      const filtered = fragrances.filter(frag => {
        const matchBrand = selectedBrand === 'ALL' || frag.brand === selectedBrand;
        const matchSearch = (frag.name || '').toLowerCase().includes(searchQuery) ||

                            (frag.notes && frag.notes.toLowerCase().includes(searchQuery));
        return matchBrand && matchSearch;

        container.innerHTML = '';
        emptyState.classList.remove('hidden');

                    <div class="w-full h-full bg-[#0D0F17] rounded-[10px] flex items-center justify-center overflow-hidden">

                    </h2>
                    <p class="text-[11px] text-zinc-400 mt-0.5 font-medium tracking-wide">
                      ${storeConfig.tagline}
                    </p>
                  </div>
                </div>

                <div class="flex flex-col sm:items-end gap-1.5 text-xs text-zinc-300">
                  <div class="no-print">
                    <button onclick="downloadPageAsInstagramImage('${pageId}', ${pageNumber})" class="px-3 py-1.5 rounded-lg bg-gradient-to-r from-[#D4AF37] via-amber-400 to-[#F1D779] text-black font-extrabold text-[11px] flex items-center gap-1.5 shadow-md hover:brightness-110 active:scale-95 transition">
                      <i data-lucide="instagram" class="w-3.5 h-3.5"></i>

                  </div>

                  <div class="flex items-center gap-3 mt-0.5">
                    <div class="flex items-center gap-1">

                      <span class="font-semibold text-white tracking-wide">${storeConfig.whatsapp}</span>
                    </div>
                    <div class="flex items-center gap-1">
                      <i data-lucide="instagram" class="w-3.5 h-3.5 text-[#D4AF37]"></i>
                      <span class="font-semibold text-zinc-300">${storeConfig.instagram}</span>
                    </div>
                  </div>
                  <div class="flex items-center gap-1 text-[10px] text-zinc-400">
                    <i data-lucide="shield-check" class="w-3.5 h-3.5 text-[#D4AF37]"></i>

                  </div>
                </div>
              </div>

                <span class="text-[#D4AF37] font-bold text-[11px] flex items-center gap-1">

                </span>

                  <span><strong class="text-[#D4AF37]">5 ml:</strong> ~75 sprays</span>
                  <span><strong class="text-white">10 ml:</strong> ~150 sprays</span>
                </div>
              </div>
            </div>

            <!-- GRILLA 2x2 DE FRAGANCIAS -->
            <div class="catalog-grid-2x2 grid grid-cols-1 sm:grid-cols-2 gap-3.5 my-3">
              ${pageItems.map(frag => {
                const p3 = frag.prices?.['3ml'] || { price: 0, inStock: true };
                const p5 = frag.prices?.['5ml'] || { price: 0, inStock: true };

                return `
                  <div class="catalog-card-item glass-card rounded-2xl overflow-hidden flex flex-col justify-between">
                    <div>
                      <!-- CONTENEDOR DE IMAGEN -->
                      <div class="relative w-full h-44 bg-[#06070A] p-2 flex items-center justify-center border-b border-zinc-800/80">
                        <img 
                          src="${frag.image || 'https://placehold.co/400x400/12141C/D4AF37?text=' + encodeURIComponent(frag.name)}" 
                          alt="${frag.name}"
                          crossorigin="anonymous"
                          class="max-h-full max-w-full object-contain filter drop-shadow-[0_8px_16px_rgba(0,0,0,0.9)]"
                        />

                        <div class="absolute top-2 left-2 flex gap-1">
                          <span class="bg-[#151824]/90 border border-zinc-700/80 text-zinc-200 font-medium text-[9px] px-2 py-0.5 rounded-md backdrop-blur-sm">
                            ${frag.concentration || 'EDP'}
                          </span>
                          ${frag.gender ? `
                            <span class="bg-[#D4AF37]/20 border border-[#D4AF37]/50 text-[#FCE89B] font-medium text-[9px] px-2 py-0.5 rounded-md backdrop-blur-sm">

                          <button onclick="deleteFragrance('${frag.id}')" title="Eliminar" class="p-1 rounded bg-black/70 hover:bg-red-600 text-white transition">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                          </button>
                        </div>
                      </div>

                      <!-- INFORMACIÓN Y NOTAS NÍTIDAS -->
                      <div style="padding: 12px 12px 6px 12px;">
                        <span style="color: #D4AF37; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1.2; margin: 0 0 2px 0; display: block;">

                        </span>
                        <div style="color: #FFFFFF; font-size: 15px; font-weight: 800; line-height: 1.25; margin: 0 0 5px 0; display: block;" title="${frag.name}">

                        <p style="color: #D1D5DB; font-size: 11px; line-height: 1.45; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                          <strong style="color: #9CA3AF; font-weight: 600;">Notas:</strong> ${frag.notes || 'Notas aromáticas exclusivas.'}
                        </p>
                      </div>
                    </div>

                    <!-- PRECIOS -->
                    <div style="padding: 4px 12px 12px 12px;">
                      <div class="bg-[#090B10] border border-zinc-800/90 rounded-xl p-1.5 grid grid-cols-3 gap-1.5 text-center">
                        <div class="p-1 rounded ${!p3.inStock ? 'opacity-40' : ''}">
                          <span class="text-[9px] uppercase font-bold text-zinc-400 block">3 ml</span>
                          <span class="text-[11px] font-bold ${p3.inStock ? 'text-white' : 'text-zinc-500 line-through'}">
                            ${p3.inStock ? formatPrice(p3.price) : 'Agotado'}
                          </span>
                        </div>

                        <div class="p-1 rounded bg-gradient-to-b from-[#D4AF37]/25 to-[#D4AF37]/10 border border-[#D4AF37]/40 ${!p5.inStock ? 'opacity-40' : ''}">
                          <span class="text-[9px] uppercase font-extrabold text-[#F1D779] block">5 ml</span>
                          <span class="text-[12px] font-black ${p5.inStock ? 'text-[#FFF1B0]' : 'text-zinc-500 line-through'}">
                            ${p5.inStock ? formatPrice(p5.price) : 'Agotado'}
                          </span>
                        </div>

                        <div class="p-1 rounded ${!p10.inStock ? 'opacity-40' : ''}">
                          <span class="text-[9px] uppercase font-bold text-zinc-400 block">10 ml</span>
                          <span class="text-[11px] font-bold ${p10.inStock ? 'text-white' : 'text-zinc-500 line-through'}">
                            ${p10.inStock ? formatPrice(p10.price) : 'Agotado'}
                          </span>
                        </div>
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <!-- PIE DE HOJA -->
            <div class="pt-2 border-t border-zinc-800/80 flex items-center justify-between text-[10px] text-zinc-400">
              <span class="text-[#D4AF37] font-medium flex items-center gap-1">
                <i data-lucide="check-circle" class="w-3.5 h-3.5"></i>
                100% Auténtico • Decants Sellados Herméticamente
              </span>
              <span class="font-semibold text-zinc-300">
                Página ${pageNumber} de ${totalPages}
              </span>
            </div>

          </div>
        `;
      }

      container.innerHTML = pagesHtml;
      lucide.createIcons();
    }

    // EXPORTAR A INSTAGRAM (4:5 / 1080 x 1350 px)
    async function downloadPageAsInstagramImage(pageElementId, pageNum) {
      const pageEl = document.getElementById(pageElementId);
      if (!pageEl) return;

      showToast('Generando imagen para Instagram...', 2500);

      const actionBtns = pageEl.querySelectorAll('.no-print');
      actionBtns.forEach(btn => btn.style.visibility = 'hidden');

      try {
        const renderedCanvas = await html2canvas(pageEl, {
          backgroundColor: '#08090D',
          scale: 2.5,
          useCORS: true,
          logging: false
        });

        const igCanvas = document.createElement('canvas');
        igCanvas.width = 1080;
        igCanvas.height = 1350;
        const ctx = igCanvas.getContext('2d');

        ctx.fillStyle = '#08090D';
        ctx.fillRect(0, 0, igCanvas.width, igCanvas.height);

        const padding = 36;
        const targetWidth = igCanvas.width - (padding * 2);
        const scaleFactor = targetWidth / renderedCanvas.width;
        const targetHeight = renderedCanvas.height * scaleFactor;
        const offsetY = Math.max(padding, (igCanvas.height - targetHeight) / 2);

        ctx.drawImage(renderedCanvas, padding, offsetY, targetWidth, targetHeight);

        const link = document.createElement('a');
        link.download = `${storeConfig.name.replace(/\s+/g, '_')}_Pagina_${pageNum}_Instagram.png`;
        link.href = igCanvas.toDataURL('image/png');
        link.click();

        showToast(`¡Página ${pageNum} descargada!`);
      } catch (err) {
        showToast('Error al generar la imagen');
      } finally {
        actionBtns.forEach(btn => btn.style.visibility = 'visible');
      }
    }

    function filterCatalog() {
      renderCatalog();
    }

    function openFragranceModal(isEdit = false) {
      document.getElementById('fragrance-modal').classList.remove('hidden');
      if (!isEdit) {
        document.getElementById('fragrance-form').reset();
        document.getElementById('form-edit-id').value = '';
        document.getElementById('modal-title').textContent = 'Agregar Fragancia';
        updateImagePreview('');
      }
    }

    function closeFragranceModal() {
      document.getElementById('fragrance-modal').classList.add('hidden');
    }

    function updateImagePreview(url) {
      const img = document.getElementById('frag-preview-img');
      const ph = document.getElementById('frag-preview-placeholder');
      if (url && url.trim() !== '') {
        img.src = url;
        img.classList.remove('hidden');
        ph.classList.add('hidden');
      } else {
        img.src = '';
        img.classList.add('hidden');
        ph.classList.remove('hidden');
      }
    }

    function handleLocalImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('frag-image-url').value = e.target.result;
        updateImagePreview(e.target.result);
      };
      reader.readAsDataURL(file);
    }

    function handleFragranceSubmit(e) {
      e.preventDefault();

      const editId = document.getElementById('form-edit-id').value;
      const name = document.getElementById('frag-name').value.trim();
      const brand = document.getElementById('frag-brand').value.trim();
      const concentration = document.getElementById('frag-concentration').value.trim();
      const gender = document.getElementById('frag-gender').value;
      const image = document.getElementById('frag-image-url').value.trim();
      const notes = document.getElementById('frag-notes').value.trim();

      const p3 = parseFloat(document.getElementById('frag-price-3ml').value) || 0;
      const p3Avail = document.getElementById('frag-3ml-avail').checked;

      const p5 = parseFloat(document.getElementById('frag-price-5ml').value) || 0;
      const p5Avail = document.getElementById('frag-5ml-avail').checked;

      const p10 = parseFloat(document.getElementById('frag-price-10ml').value) || 0;
      const p10Avail = document.getElementById('frag-10ml-avail').checked;

      const itemData = {
        id: editId || 'frag-' + Date.now(),
        name,
        brand,
        concentration,
        gender,
        image: image,
        notes,
        prices: {
          "3ml": { price: p3, inStock: p3Avail },
          "5ml": { price: p5, inStock: p5Avail },
          "10ml": { price: p10, inStock: p10Avail }
        }
      };

      if (editId) {
        const index = fragrances.findIndex(f => f.id === editId);
        if (index !== -1) fragrances[index] = itemData;
      } else {
        fragrances.unshift(itemData);
      }

      saveFragrances();
      renderCatalog();
      closeFragranceModal();
      showToast('Fragancia guardada');
    }

    function editFragrance(id) {
      const frag = fragrances.find(f => f.id === id);
      if (!frag) return;

      document.getElementById('form-edit-id').value = frag.id;
      document.getElementById('frag-name').value = frag.name || '';
      document.getElementById('frag-brand').value = frag.brand || '';
      document.getElementById('frag-concentration').value = frag.concentration || 'Eau de Parfum';
      document.getElementById('frag-gender').value = frag.gender || 'Unisex';
      document.getElementById('frag-image-url').value = frag.image || '';
      document.getElementById('frag-notes').value = frag.notes || '';

      const p3 = frag.prices?.['3ml'] || { price: 0, inStock: true };
      const p5 = frag.prices?.['5ml'] || { price: 0, inStock: true };
      const p10 = frag.prices?.['10ml'] || { price: 0, inStock: true };

      document.getElementById('frag-price-3ml').value = p3.price || '';
      document.getElementById('frag-3ml-avail').checked = p3.inStock;

      document.getElementById('frag-price-5ml').value = p5.price || '';
      document.getElementById('frag-5ml-avail').checked = p5.inStock;

      document.getElementById('frag-price-10ml').value = p10.price || '';
      document.getElementById('frag-10ml-avail').checked = p10.inStock;

      updateImagePreview(frag.image || '');
      document.getElementById('modal-title').textContent = 'Editar Fragancia';
      openFragranceModal(true);
    }

    function deleteFragrance(id) {
      fragrances = fragrances.filter(f => f.id !== id);
      saveFragrances();
      renderCatalog();
      showToast('Fragancia eliminada');
    }

    function openStoreConfigModal() {
      document.getElementById('config-store-name').value = storeConfig.name;
      document.getElementById('config-store-tagline').value = storeConfig.tagline;
      document.getElementById('config-store-whatsapp').value = storeConfig.whatsapp;
      document.getElementById('config-store-instagram').value = storeConfig.instagram;
      document.getElementById('config-store-notes').value = storeConfig.notes;
      document.getElementById('config-store-logo').value = storeConfig.logo || '';
      updateLogoModalPreview(storeConfig.logo || '');
      document.getElementById('store-modal').classList.remove('hidden');
    }

    function closeStoreConfigModal() {
      document.getElementById('store-modal').classList.add('hidden');
    }

    function handleStoreConfigSubmit(e) {
      e.preventDefault();
      storeConfig.name = document.getElementById('config-store-name').value.trim();
      storeConfig.tagline = document.getElementById('config-store-tagline').value.trim();
      storeConfig.whatsapp = document.getElementById('config-store-whatsapp').value.trim();
      storeConfig.instagram = document.getElementById('config-store-instagram').value.trim();
      storeConfig.notes = document.getElementById('config-store-notes').value.trim();
      storeConfig.logo = document.getElementById('config-store-logo').value.trim();

      saveStoreConfig();
      closeStoreConfigModal();
      showToast('Datos actualizados');
    }

    function showToast(message, duration = 2000) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'px-3 py-2 rounded-xl bg-zinc-900 border border-[#D4AF37]/50 text-white text-xs font-semibold shadow-2xl flex items-center gap-2 pointer-events-auto';
      toast.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5 text-[#D4AF37]"></i> <span>${message}</span>`;
      container.appendChild(toast);
      lucide.createIcons();
      setTimeout(() => toast.remove(), duration);
    }

    window.onload = function() {
      initApp();
    };
  </script>
</body>
